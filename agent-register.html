<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Become an Agent | ASBData Ghana</title>
<link rel="icon" href="assets/logo.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card wide">
    <div class="auth-logo">
      <img src="assets/logo.png" alt="ASBData Ghana" />
    </div>
    <h1>Apply to become an agent</h1>
    <p class="auth-sub">Fill in your details below. Approved agents get their own wallet and dashboard within 24 hours.</p>

    <div id="apply-message" class="form-message"></div>

    <form data-mock-submit data-message-target="apply-message" data-success-text="Application received. We'll review it and email you within 24 hours.">
      <div class="field-row">
        <div class="field">
          <label for="fullname">Full name</label>
          <input id="fullname" type="text" placeholder="e.g. Kwame Asante" required />
        </div>
        <div class="field">
          <label for="phone">Phone number</label>
          <input id="phone" type="tel" placeholder="024 000 0000" required />
        </div>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" placeholder="you@example.com" required />
      </div>

      <div class="field-row">
        <div class="field">
          <label for="region">Region</label>
          <select id="region" required>
            <option value="">Select region</option>
            <option>Greater Accra</option>
            <option>Ashanti</option>
            <option>Western</option>
            <option>Eastern</option>
            <option>Central</option>
            <option>Northern</option>
            <option>Volta</option>
            <option>Bono</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label for="momo-network">Mobile Money network</label>
          <select id="momo-network" required>
            <option value="">Select network</option>
            <option>MTN Mobile Money</option>
            <option>AT Money</option>
            <option>Telecel Cash</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="momo-number">Mobile Money number</label>
        <input id="momo-number" type="tel" placeholder="024 000 0000" required />
        <p class="field-hint">Your commission payouts will be sent to this number.</p>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="password">Create password</label>
          <input id="password" type="password" placeholder="••••••••" minlength="6" required />
        </div>
        <div class="field">
          <label for="confirm-password">Confirm password</label>
          <input id="confirm-password" type="password" placeholder="••••••••" minlength="6" required />
        </div>
      </div>

      <label class="checkbox-field">
        <input type="checkbox" required />
        <span>I agree to the ASBData Ghana agent terms and confirm the details above are accurate.</span>
      </label>

      <button type="submit" class="btn btn-primary btn-block">Submit Application</button>
    </form>

    <div class="form-foot">
      Already an approved agent? <a href="agent-login.html">Log in here</a>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
