<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agent Login | ASBData Ghana</title>
<link rel="icon" href="assets/logo.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="assets/logo.png" alt="ASBData Ghana" />
    </div>
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to your agent dashboard to buy data, track sales and view commission.</p>

    <div id="login-message" class="form-message"></div>

    <form data-mock-submit data-message-target="login-message" data-success-text="Logged in. Redirecting to your dashboard…" data-redirect="agent-dashboard.html">
      <div class="field">
        <label for="login-id">Phone number or email</label>
        <input id="login-id" type="text" placeholder="024 000 0000 or you@example.com" required />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input id="login-password" type="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log In</button>
    </form>

    <div class="form-foot">
      Not an agent yet? <a href="agent-register.html">Apply here</a>
    </div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
